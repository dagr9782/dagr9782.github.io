_country = pn.widgets.Select(name=atn.initial_country_of_risk, options=[pd_constants.au, pd_constants.nz, pd_constants.br, pd_constants.us, pd_constants.cl, pd_constants.ca, pd_constants.pe, pd_constants.ar], value=pd_constants.au)\n\tinput_client_status = pn.widgets.Select(name=atn.initial_client_status, options=['Performing', 'In-default'], value='Performing')\n\tinput_pd_manual_override = pn.widgets.Select(name=atn.initial_pd_manual_override, options=pd_constants.manual_override_values, value=0)\n\tinput_pd_statements = pn.widgets.Select(name=atn.initial_pd_statements, options=[3, 2, 1], value=3)\n\tinput_lgd_manual_override = pn.widgets.Select(name=atn.initial_lgd_manual_override, options=lgd_constants.manual_override_values, value=0)\n\tinput_cols = {input_country.name: input_country, input_client_status.name: input_client_status, input_pd_manual_override.name: input_pd_manual_override, input_pd_statements.name: input_pd_statements, input_lgd_manual_override.name: input_lgd_manual_override}\n\tinput_cols_description = {input_country.name: 'Country of Risk will be mapped to: \\nAU, AR maps to AU\\nBR maps to BR\\nCL, PE maps to CL\\nNZ maps to NZ\\nUS, CA maps to US', input_client_status.name: 'Status to indicate if a client is performing or in-default.', input_pd_manual_override.name: 'Override value for PD. Maximum 2 ratings upgrade, and downgrade up to 10 ratings.', input_lgd_manual_override.name: 'Override value for LGD. The relative change by which the LGD value will be altered.', input_pd_statements.name: 'By default the model uses 3 financial statements to derive the financial risk drivers. If fewer are available, select the actual number.'}\n\n\npn.extension('tabulator')\n\nclass Dashboard:\n    _dashboard_title: str\n    _models: dict\n\n    def __init__(self, title, models, initial_inputs, inputs, outputs, version, description):\n        self._dashboard_title = title\n        self._models = models\n        self._initial_inputs = initial_inputs\n        self._inputs = inputs\n        self._outputs = outputs\n        self._version = version\n        self._dashboard_description = description\n        self.calculate_button = pn.widgets.Button(name='Calculate', button_type='primary', icon='calculator', icon_size='16px', align='center')\n        self.calculate_button.on_click(self.update_dashboard)\n        self.watchers = {}\n        self.wait_icon = pn.widgets.ButtonIcon(icon='hourglass', size='2em', visible=False, align='center')\n        self.auto_calculate_toggle = pn.widgets.Switch(name='Auto Calculate', align='center')\n        self.auto_calculate_toggle.param.watch(self.auto_update_dashboard, 'value')\n        self.input_country = self.copy_widget(self._initial_inputs[dan.input_cols][atn.initial_country_of_risk])\n        self.input_country.param.watch(self.update_input_country, 'value')\n        self.input_client_status = self.copy_widget(self._initial_inputs[dan.input_cols][atn.initial_client_status])\n        self.input_client_status.param.watch(self.update_input_client_status, 'value')\n        self.input_pd_manual_override = self.copy_widget(self._initial_inputs[dan.input_cols][atn.initial_pd_manual_override])\n        self.input_pd_manual_override.param.watch(self.update_input_pd_manual_override, 'value')\n        self.input_pd_statements = self.copy_widget(self._initial_inputs[dan.input_cols][atn.initial_pd_statements])\n        self.input_pd_statements.param.watch(self.update_input_pd_number_of_statements, 'value')\n        self.input_lgd_manual_override = self.copy_widget(self._initial_inputs[dan.input_cols][atn.initial_lgd_manual_override])\n        self.input_lgd_manual_override.param.watch(self.update_input_lgd_manual_override, 'value')\n\n    @staticmethod\n    def copy_widget(widget) -> pn.widgets.Widget:\n        widget_cls = widget.__class__\n        new_widget = widget_cls(name=widget.name, value=widget.value)\n        if hasattr(widget, 'options'):\n            new_widget.options = widget.options\n        if hasattr(widget, 'start'):\n            new_widget.start = widget.start\n        if hasattr(widget, 'end'):\n            new_widget.end = widget.end\n        if hasattr(widget, 'step'):\n            new_widget.step = widget.step\n        return new_widget\n\n    @staticmethod\n    def disable_widget(list_of_widgets, name, disabled=True):\n        input_names = [widget.name for widget in list_of_widgets]\n        idx = input_names.index(name)\n        list_of_widgets[idx].disabled = disabled\n\n    @staticmethod\n    def hide_widget(list_of_widgets, name, hide=True):\n        input_names = [widget.name for widget in list_of_widgets]\n        idx = input_names.index(name)\n        list_of_widgets[idx].visible = not hide\n\n    def update_input_country(self, event=None):\n        """Update input attributes based on country of risk\n\n            PD:\n            RANZ (AU, NZ, AR): R3_2A = SUST_EBITDA / NetInterestPaid -> disable CPLTD\n            USLA (US, CA, BR, CL, PE): DSCR = SUST_EBITDA / CPLTD -> disable NetInterestPaid\n\n           Note: Manual change, perhaps put it in a config\n        Optional to change disable to visible later\n\n        """\n        country = self.input_country.value\n        print(f'Update input based on country of risk: {country}')\n        col_idx = [widget.name for widget in self.dict_input_cols['Obligor']].index(atn.country_of_risk_ui)\n        self.dict_input_cols['Obligor'][col_idx].value = country\n        cols_usla = [atn.cpltd_interest_t_ui, atn.cpltd_interest_t_1_ui, atn.cpltd_interest_t_2_ui]\n        cols_ranz = [atn.net_interest_paid_t_ui, atn.net_interest_paid_t_1_ui, atn.net_interest_paid_t_2_ui]\n        if country in ['NZ', 'AU', 'AR']:\n            for col in cols_ranz:\n                self.hide_widget(self.dict_input_cols['Obligor'], col, False)\n                self.hide_widget(self.dict_input_desc['Obligor'], col, False)\n            for col in cols_usla:\n                self.hide_widget(self.dict_input_cols['Obligor'], col, True)\n                self.hide_widget(self.dict_input_desc['Obligor'], col, True)\n        elif country in ['US', 'BR', 'CL', 'CA', 'PE']:\n            for col in cols_ranz:\n                self.hide_widget(self.dict_input_cols['Obligor'], col, True)\n                self.hide_widget(self.dict_input_desc['Obligor'], col, True)\n            for col in cols_usla:\n                self.hide_widget(self.dict_input_cols['Obligor'], col, False)\n                self.hide_widget(self.dict_input_desc['Obligor'], col, False)\n        else:\n            for col in cols_usla + cols_ranz:\n                self.hide_widget(self.dict_input_cols['Obligor'], col, False)\n                self.hide_widget(self.dict_input_desc['Obligor'], col, False)\n\n    def update_input_client_status(self, event=None):\n        """Update input attributes based on performing/in-default"""\n        status = self.input_client_status.value\n        print(f'Update input based on client status: {status}')\n        col_idx = [widget.name for widget in self.dict_input_cols['Obligor']].index(atn.crc_code_ui)\n        self.dict_input_cols['Obligor'][col_idx].value = 'GOOD' if status == 'Performing' else 'DEFAULT'\n        cols_obl_def = [atn.default_date_ui]\n        cols_facility_default = [atn.limit_def_ui, atn.outstanding_def_ui]\n        if status == 'Performing':\n            for col in cols_obl_def:\n                self.hide_widget(self.dict_input_cols['Obligor'], col, True)\n                self.hide_widget(self.dict_input_desc['Obligor'], col, True)\n            for col in cols_facility_default:\n                self.hide_widget(self.dict_input_cols['Facility'], col, True)\n                self.hide_widget(self.dict_input_desc['Facility'], col, True)\n        else:\n            for col in cols_obl_def:\n                self.hide_widget(self.dict_input_cols['Obligor'], col, False)\n                self.hide_widget(self.dict_input_desc['Obligor'], col, False)\n            for col in cols_facility_default:\n                self.hide_widget(self.dict_input_cols['Facility'], col, False)\n                self.hide_widget(self.dict_input_desc['Facility'], col, False)\n\n    def update_hide_user_inputs(self, event=None):\n        """Hide input attributes\n\n        TODO: add to config\n\n        """\n        dict_input_to_hide = {'Obligor': [atn.country_of_risk_ui, atn.crc_code_ui, atn.pd_manual_override_flag_ui, atn.pd_manual_override_ui, 'FINANCIAL_STATEMENT_DATE_T', 'FINANCIAL_STATEMENT_DATE_T-1', 'FINANCIAL_STATEMENT_DATE_T-2'], 'Facility': [atn.lgd_manual_override_flag_ui, atn.lgd_manual_override_ui]}\n        for (table, cols) in dict_input_to_hide.items():\n            for col in cols:\n                self.hide_widget(self.dict_input_cols[table], col, True)\n                self.hide_widget(self.dict_input_desc[table], col, True)\n\n    def update_input_pd_manual_override(self, event=None):\n        """Update input attributes based pd manual override"""\n        pd_override = self.input_pd_manual_override.value\n        print(f'Update input based on pd override: {pd_override}')\n        col_idx_flag = [widget.name for widget in self.dict_input_cols['Obligor']].index(atn.pd_manual_override_flag_ui)\n        col_idx_override = [widget.name for widget in self.dict_input_cols['Obligor']].index(atn.pd_manual_override_ui)\n        self.dict_input_cols['Obligor'][col_idx_override].value = pd_override\n        self.dict_input_cols['Obligor'][col_idx_flag].value = 0 if pd_override == 0 else 1\n\n    def update_input_pd_number_of_statements(self, event=None):\n        """Update input attributes based on number of financial statements"""\n        pd_statements = self.input_pd_statements.value\n        print(f'Update input based on pd number of statements: {pd_statements}')\n        current_date = datetime.datetime.today().date()\n        date_t_2 = (current_date - pd.DateOffset(years=1)).date() if pd_statements == 3 else None\n        date_t_1 = None if pd_statements == 1 else (current_date - pd.DateOffset(years=2)).date()\n        col_idx_t_2 = [widget.name for widget in self.dict_input_cols['Obligor']].index(atn.financial_statement_date_t_2)\n        self.dict_input_cols['Obligor'][col_idx_t_2].value = date_t_2\n        col_idx_t_1 = [widget.name for widget in self.dict_input_cols['Obligor']].index(atn.financial_statement_date_t_1)\n        self.dict_input_cols['Obligor'][col_idx_t_1].value = date_t_1\n        cols_by_t = {atn.sust_ebitda_t_ui: [atn.sust_ebitda_t_1_ui, atn.sust_ebitda_t_2_ui], atn.net_interest_paid_t_ui: [atn.net_interest_paid_t_1_ui, atn.net_interest_paid_t_2_ui], atn.net_worth_t_ui: [atn.net_worth_t_1_ui, atn.net_worth_t_2_ui], atn.total_assets_t_ui: [atn.total_assets_t_1_ui, atn.total_assets_t_2_ui], atn.net_sales_t_ui: [atn.net_sales_t_1_ui, atn.net_sales_t_2_ui], atn.cpltd_interest_t_ui: [atn.cpltd_interest_t_1_ui, atn.cpltd_interest_t_2_ui]}\n        list_of_widgets = self.dict_input_cols['Obligor']\n        input_names = [widget.name for widget in list_of_widgets]\n        for (col, cols_t) in cols_by_t.items():\n            idx = input_names.index(col)\n            if list_of_widgets[idx].visible:\n                if pd_statements == 1:\n                    for c in cols_t:\n                        self.hide_widget(self.dict_input_cols['Obligor'], c, True)\n                        self.hide_widget(self.dict_input_desc['Obligor'], c, True)\n                elif pd_statements == 2:\n                    self.hide_widget(self.dict_input_cols['Obligor'], cols_t[1], True)\n                    self.hide_widget(self.dict_input_desc['Obligor'], cols_t[1], True)\n                    self.hide_widget(self.dict_input_cols['Obligor'], cols_t[0], False)\n                    self.hide_widget(self.dict_input_desc['Obligor'], cols_t[0], False)\n                else:\n                    for c in cols_t:\n                        self.hide_widget(self.dict_input_cols['Obligor'], c, False)\n                        self.hide_widget(self.dict_input_desc['Obligor'], c, False)\n\n    def update_input_lgd_manual_override(self, event=None):\n        """Update input attributes based lgd manual override"""\n        pd_override = self.input_lgd_manual_override.value\n        print(f'Update input based on lgd override: {pd_override}')\n        col_idx_flag = [widget.name for widget in self.dict_input_cols['Facility']].index(atn.lgd_manual_override_flag_ui)\n        col_idx_override = [widget.name for widget in self.dict_input_cols['Facility']].index(atn.lgd_manual_override_ui)\n        self.dict_input_cols['Facility'][col_idx_override].value = pd_override\n        self.dict_input_cols['Facility'][col_idx_flag].value = 0 if pd_override == 0 else 1\n\n    def auto_update_dashboard(self, event):\n        """Automatically update the dashboard when the toggle is switched on."""\n        if event.new:\n            print('Enable Auto updating')\n            for table_name in self.dict_editor.keys():\n                self.watchers[table_name] = self.dict_editor[table_name].param.watch(self.update_dashboard, 'value')\n            self.update_dashboard()\n        else:\n            print('Disable Auto updating')\n            for table_name in self.dict_editor.keys():\n                self.dict_editor[table_name].param.unwatch(self.watchers[table_name])\n\n    def update_dashboard(self, event=None):\n        """Update the dashboard when the button is clicked or toggle is active.\n        The dashboard functions are binded to self.dict_editor"""\n        self.wait_icon.visible = True\n        print('Calculating dashboard...')\n        for model_name in self._models.keys():\n            model = self._models[model_name][dan.model]\n            self.dict_output[model_name].value = model.run(**self.dict_tables)\n        print('Dashboard updated.')\n        self.wait_icon.visible = False\n\n    @staticmethod\n    def create_rating_numbers_output(results_df, rating_col, id_col):\n        if len(results_df) == 0:\n            return None\n        else:\n            return pn.Column(*[pn.indicators.Number(name=f'{id_col} {results_df.loc[count, id_col]}', value=results_df.loc[count, rating_col], format='R{value}', colors=[(13, 'green'), (17, 'gold'), (20, 'red')]) for count in range(0, len(results_df))])\n\n    def create_model_tab(self, model_name):\n        """Create the model tab for a single model\n\n        Uses pn.bind() to run the model, then bind results to columns via\n        the specified dict_output_cols\n        """\n        model = self._models[model_name][dan.model]\n        self.dict_output[model_name] = pn.widgets.DataFrame(model.run(**self.dict_tables), name=model_name)\n        display_cols = [pn.Column(f'## {key}', pn.bind(model.get_columns, cols, self.dict_output[model_name])) for (key, cols) in model.dict_output_cols.items()]\n        if dan.rating_cols_to_display in self._models[model_name].keys():\n            (rating_col, id_col) = self._models[model_name][dan.rating_cols_to_display]\n            rating_cols = pn.Column(f'## {rating_col}', pn.bind(self.create_rating_numbers_output, self.dict_output[model_name], rating_col, id_col))\n            display_cols.append(rating_cols)\n        return (model_name, pn.Column(pn.Row(*display_cols), descr.disclaimer_text[model_name]))\n\n    def create_output_tab(self, tab_name):\n        """Create the output tab for multiple models\n\n        Uses pn.bind() to bind the model results from self.dict_output\n        """\n        rows = []\n        for (table_name, table_function) in self._outputs[tab_name].items():\n            if not callable(table_function):\n                if dan.rating_cols_to_display in table_function.keys():\n                    (rating_col, id_col) = table_function[dan.rating_cols_to_display]\n                    rating_cols = pn.Column(f'## {rating_col}', pn.bind(self.create_rating_numbers_output, self.dict_output[dan.pd], rating_col, id_col))\n                    rows.append(rating_cols)\n            else:\n                rows.append(pn.Row(f'### {table_name}', pn.bind(table_function, **self.dict_output)))\n        return (f'{tab_name}', pn.Column(*rows, descr.disclaimer_text[tab_name]))\n\n    def add_row(self, event, table_name):\n        """help function for adding a row to the table on event"""\n        new_row = {input.name: input.value for input in self.dict_input_cols[table_name]}\n        self.dict_tables[table_name] = pd.concat([self.dict_tables[table_name], pd.DataFrame([new_row])], ignore_index=True)\n        self.dict_editor[table_name].value = self.dict_tables[table_name]\n        print(f'Added row to {table_name}, shape: {self.dict_tables[table_name].shape}')\n\n    def delete_selected_rows(self, event, table_name):\n        """help function for deleting selected rows from the table on event"""\n        selected_indices = self.dict_editor[table_name].selection\n        self.dict_tables[table_name] = self.dict_tables[table_name].drop(selected_indices).reset_index(drop=True)\n        self.dict_editor[table_name].value = self.dict_tables[table_name]\n        print(f'Deleted {len(selected_indices)} row(s) of {table_name}, shape: {self.dict_tables[table_name].shape}')\n\n    def create_input_tab(self):\n        """Create the input tab for multiple input tables"""\n        input_tab = []\n        table_tab = []\n        self.dict_input_desc = {}\n        self.dict_input_cols = {}\n        self.dict_tables = {}\n        self.dict_editor = {}\n        self.dict_delete_buttons = {}\n        self.dict_add_buttons = {}\n        self.dict_output = {}\n        for (table_name, table_input) in self._inputs.items():\n            print(f'Creating {table_name} table')\n            col_names = [col.name for col in table_input[dan.input_cols]]\n            self.dict_input_cols[table_name] = [self.copy_widget(widget) for widget in table_input[dan.input_cols]]\n            self.dict_tables[table_name] = pd.DataFrame(columns=col_names)\n            mapping_editor = {pn.widgets.input.TextInput: {'type': 'input'}, pn.widgets.FloatInput: {'type': 'number'}, pn.widgets.IntInput: {'type': 'number'}, pn.widgets.Select: {'type': 'list'}, pn.widgets.DatePicker: {'type': 'date'}}\n            editors = {col.name: mapping_editor.get(type(col), None).copy() for col in table_input[dan.input_cols]}\n            selectors = {col.name: col.options for col in table_input[dan.input_cols] if isinstance(col, pn.widgets.Select)}\n            for (name, options) in selectors.items():\n                editors[name]['values'] = options\n            formatters = {name: bmw.DateFormatter(format='%Y-%m-%d') for (name, col) in editors.items() if col == {'type': 'date'}}\n            self.dict_editor[table_name] = pn.widgets.Tabulator(self.dict_tables[table_name], show_index=False, editors=editors, selectable='checkbox', layout='fit_data_stretch', stylesheets=[':host .tabulator {font-size: 12px;}'], formatters=formatters)\n            self.dict_delete_buttons[table_name] = pn.widgets.Button(name='Delete selected rows', button_type='danger', button_style='outline')\n            self.dict_delete_buttons[table_name].on_click(partial(self.delete_selected_rows, table_name=table_name))\n            self.dict_add_buttons[table_name] = pn.widgets.Button(name='Add row', button_type='primary', icon='plus', icon_size='14px')\n            self.dict_add_buttons[table_name].on_click(partial(self.add_row, table_name=table_name))\n            input_description = [pn.widgets.TooltipIcon(value=table_input[dan.input_cols_description].get(input_col.name, 'Enter description'), name=input_col.name) for input_col in self.dict_input_cols[table_name]]\n            self.dict_input_desc[table_name] = input_description\n            input_tab.append(pn.Column(pn.Row(f'### {table_name} Input', self.dict_add_buttons[table_name]), pn.Column(*[pn.Row(input_col, description) for (input_col, description) in zip(self.dict_input_cols[table_name], input_description, strict=False)], scroll=True, height=400)))\n            table_tab.append(pn.Column(pn.Row(f'### {table_name} Table', self.dict_delete_buttons[table_name]), self.dict_editor[table_name]))\n        init_input_description = {input_col_name: pn.widgets.TooltipIcon(value=self._initial_inputs[dan.input_cols_description].get(input_col_name, 'Enter description'), name=input_col_name) for input_col_name in self._initial_inputs[dan.input_cols].keys()}\n        initial_input_tab = pn.Row(pn.Column('### Obligor information', pn.Row(self.input_country, init_input_description[atn.initial_country_of_risk], self.input_client_status, init_input_description[atn.initial_client_status], self.input_pd_statements, init_input_description[atn.initial_pd_statements], self.input_pd_manual_override, init_input_description[atn.initial_pd_manual_override], self.input_lgd_manual_override, init_input_description[atn.initial_lgd_manual_override])))\n        self.update_input_country()\n        self.update_input_client_status()\n        self.update_input_pd_manual_override()\n        self.update_input_pd_number_of_statements()\n        self.update_input_lgd_manual_override()\n        self.update_hide_user_inputs()\n        calculation_tab = pn.Row(self.calculate_button, self.wait_icon, 'Auto-calculate:', self.auto_calculate_toggle)\n        final_input_tab = pn.Column(calculation_tab, pn.layout.Divider(), initial_input_tab, pn.layout.Divider(), pn.Row(*input_tab), pn.layout.Divider(), pn.Column(*table_tab))\n        return ('Input', final_input_tab)\n\n    def app(self) -> pn.template:\n        template = pn.template.BootstrapTemplate(title=self._dashboard_title)\n        template.main.append(pn.Tabs(('Info', pn.Column(pn.pane.HTML(self._dashboard_description, width=700, styles={'font-size': '10pt'}))), self.create_input_tab(), *(self.create_model_tab(model_name) for model_name in self._models.keys()), *(self.create_output_tab(output_name) for output_name in self._outputs.keys())))\n        template.main.append(pn.Row(f'Version {self._version}'))\n        return template\n\nclass dan:\n\trrr = "RRR"\n\tinput_cols = "input_cols"\n\tinput_cols_description = "input_cols_description"\n\tcol_tags = "col_tags"\n\trating_cols_to_display = "rating_cols_to_display"\n\ttags_to_display = "tags_to_display"\n\tmodel = "model"\n\tparameters = "parameters"\n\tpd = "PD"\n\tlgd = "LGD"\n\tead = "EAD"\n\n\n\t# Tables\n\tobligor = "Obligor"\n\tfacility = "Facility"\n\tcollateral = "Collateral"\n\n\t# Output columns\n\tinput = "Input"\n\trdd = "Risk drivers"\n\tintermediate = "Intermediate"\n\toutput = "Output"\n\n\t# Output tab names\n\tsummary = "Summary"\n\tpd_results = "PD Results"\n\tobligor_results = "Obligor Results"\n\tfacility_results = "Facility Results"\n\tead_and_lgd_results = "EAD and LGD Results"\n\tpd_ratings = "PD Ratings"\n\n\nclass descr:\n\n\tdisclaimer_text = {dan.pd: pn.pane.Markdown('\\n        **Disclaimer**: These variables represent the best estimate outputs used for credit assessment. For regulatory capital calculations,\\n        Margin of Conservatism (MoC) is incorporated in the next steps in the chain.\\n        '), dan.ead: pn.pane.Markdown('\\n        **Disclaimer**: These variables represent the best estimate outputs used for credit assessment. For regulatory capital calculations,\\n        Margin of Conservatism (MoC) and Downturn adjustments are incorporated in the next steps in the chain.\\n        '), dan.lgd: pn.pane.Markdown('\\n        **Disclaimer**: These variables represent the best estimate outputs used for credit assessment. For regulatory capital calculations,\\n        Margin of Conservatism (MoC) and Downturn adjustments are incorporated in the next steps in the chain.\\n        '), dan.summary: pn.pane.Markdown('\\n        **Disclaimer**: These variables represent the best estimate outputs used for credit assessment. For regulatory capital calculations,\\n        Margin of Conservatism (MoC) and Downturn adjustments are incorporated in the next steps in the chain.\\n        ')}\n\tinfo_text = '\\n<!DOCTYPE html>\\n<html lang="en">\\n<head>\\n       <meta charset="UTF-8">\\n       <meta name="viewport" content="width=device-width, initial-scale=1.0">\\n       <title>Tool Description and Instructions</title>\\n</head>\\n<body class="pn-loading pn-arc">\\n       <h2>Introduction</h2>\\n       <p>The Rural Prototype tool<sup>1</sup>: </p>\\n           <ul>\\n        <li>Is a self-contained HTML tool that runs directly from the browser. </li>\\n        <li>Its aim is to provide directional guidance on the impact of the new model. </li>\\n        <li>Is available for a selective group of users to analyze the impact of the new Rural Model v2.0 at a Joint Obligor/Facility level.</li>\\n    </ul>\\n   <p>Key features of the Rural Prototype: </p>\\n           <ul>\\n        <li>Is developed and fully aligned with PD/LGD/EAD models of the new Rural Model v2.0.</li>\\n        <li>The PD, LGD and EAD outputs are on Best Estimates level, i.e. they do not include conservatism required by regulation for capital calculation (Margin of Conservatism and Additional Conservatism) and downturn adjustment (only for EAD and LGD).</li>\\n        <li>Can calculate the results for multiple obligors and facilities simultaneously to support impact comparisons.</li>\\n    </ul>\\n   <p>Instructions: </p>\\n       <ul>\\n          <li>In the input sheet, first add obligors, facilities, and collaterals. The added rows will be shown in the tables below and can be modified.</li>\\n          <li>Next, press calculate. The results will be displayed in the PD, EAD, LGD and Summary sheets.</li>\\n       </ul>\\n     <p>Note: </p>\\n        <ul>\\n           <li>A PD<sup>2</sup> calculation can be calculated by itself. To do this, all the obligor information needs to be filled. LGD requires Obligor, Facility and Collateral information to be supplied, while EAD requires Obligor and Facility information.</li>\\n           <li>Ensure that the IDs are unique when performing calculations with multiple obligors, facilities, and collateral.</li>\\n           <li>The prototype does not support currency conversions. Therefore, if an obligor has multiple facilities in different currencies, the values should be first converted to a single common currency.</li>\\n           <li>For derivate facilities the EAD model is not used to predict an EAD. Instead users should provide the EAD. This should be entered in the Outstanding field of the facility inputs</li>\\n        </ul>\\n\\n      <p style="font-size: 12px;"><sup>1</sup>Proprietary tool developed by Tribe Credit Analytics (TCA), Area Rural.</p>\\n      <p style="font-size: 12px;"><sup>2</sup>Rural 2.0 PD model will have the same shadow qualitative questions as Rural 1.0 PD Model. These qualitative questions are not included in the prototype as they do not have an impact on the PD output.</p>\\n\\n    <br>\\n\\n    <h2>General rules of engagement</h2>\\n    <ul>\\n        <li>The Prototype is <b>not identical to the CAS calculator in production</b>. It\u2019s developed as close to reality as possible. However, as it does not include validation checks, error handling and does not cover all possible edge cases, it can\\'t be ensured that it will provide the same exact results as those expected in the production environment once the model will go-live.</li>\\n        <li>Therefore, its <b>use should be strictly limited</b> to the sole purpose of familiarizing with the model and only until the model is officially deployed (expected March 2026).</li>\\n        <li>The prototype must not be used after the model is live in production (expected March 2026). Once the model is live, the only source of truth will be the model outcomes provided via the front-end systems (CROP, BAW).</li>\\n        <li>Prototype <b>should not be the basis for decision making related to any of the model uses</b> such as loan application and acceptance, pricing, provisioning, capital planning, etc.</li>\\n        <li>Prototype should be treated as <b>confidential</b>.</li>\\n        <li>Prototype is a <b>live working tool</b>. It will be updated whenever the need arises. Users will be notified when significant changes are done that would impact the outcomes.</li>\\n    </ul>\\n\\n</body>\\n</html>\\n'\n\n\nclass BaseModelPanel:\n    """Base model for running the IRB models in the Panel dashboard\n    This class will be used in combination with Panel pn.bind()\n    """\n    dict_output_cols: dict[list] = {}\n\n    @staticmethod\n    def get_columns(columns, df):\n        """Used for Panel bind function to display output\n\n        Returns None if df is None\n        """\n        if len(df) == 0:\n            return None\n        else:\n            return df[columns].T\n\n    @abstractmethod\n    def calculate(self, **kwargs):\n        """Abstract method to calculate the model output\n\n        kwargs: DataFrames of the input tables obligor, facility and collateral\n\n        Optional to build in:\n         - Data validation checks\n         - Data processing steps\n\n        Returns:\n            pd.DataFrame: The calculated output\n\n            Note: returns empty DataFrame if input tables are empty\n        """\n        pass\n\n    def run(self, **kwargs):\n        """Used for Panel bind function to generate a DataFrame output\n\n        Returns None if df is None\n        """\n        obligor_df = kwargs.get(dan.obligor)\n        facility_df = kwargs.get(dan.facility)\n        collateral_df = kwargs.get(dan.collateral)\n        if obligor_df is None or facility_df is None or collateral_df is None:\n            raise ValueError('One or more required constants are missing in kwargs')\n        results_df = self.calculate(**kwargs)\n        return results_df\n\nclass PDModelPanel(BaseModelPanel):\n    dict_output_cols = {dan.input: [atn.obligor_ssid_ui, atn.country_of_risk_ui, atn.reporting_date_ui, atn.months_in_material_arrears_last_12m_ui, atn.cre_qual_management_merged_ui, atn.pd_manual_override_flag_ui, atn.pd_manual_override_ui], dan.rdd: [atn.dscr_avg_3y_ui, atn.r3_2a_avg_3y_ui, atn.r5_2_avg_3y_ui, atn.r7_8_avg_3y_ui], dan.intermediate: [pd_constants.dscr_avg_3y_imputed, pd_constants.r3_2a_avg_3y_imputed, pd_constants.r5_2_avg_3y_imputed, pd_constants.r7_8_avg_3y_imputed, pd_constants.months_in_material_arrears_last_12m_imputed, pd_constants.cre_qual_management_merged_imputed, pd_constants.dscr_avg_3y_transf, pd_constants.r3_2a_avg_3y_transf, pd_constants.r5_2_avg_3y_transf, pd_constants.r7_8_avg_3y_transf, pd_constants.months_in_material_arrears_last_12m_transf, pd_constants.cre_qual_management_merged_transf, pd_constants.dscr_avg_3y_norm, pd_constants.r3_2a_avg_3y_norm, pd_constants.r5_2_avg_3y_norm, pd_constants.r7_8_avg_3y_norm, pd_constants.months_in_material_arrears_last_12m_norm, pd_constants.cre_qual_management_merged_norm], dan.output: [pd_constants.score_uncalibrated, pd_constants.pd_uncalibrated, pd_constants.rating_uncalibrated, pd_constants.pd_calibrated, pd_constants.rating_calibrated, atn.pd_be_ui, atn.rating_be_ui]}\n\n    def calculate(self, **kwargs):\n        """Calculate the PD model output"""\n        print('Calculating PD model')\n        obligor_df = kwargs.get(dan.obligor)\n        rename_cols = copy.deepcopy(atn.attribute_mapping)\n        rename_cols[atn.obligor_ssid_ui] = pd_constants.client_id\n        input_df = obligor_df.copy()\n        input_df = input_df.rename(columns=rename_cols)\n        if len(input_df) != 0:\n            model = PD_RDD(df=input_df, parameters=parameters_pd, rdd_calculation=True)\n            model.calculate()\n            result_df = model._dataset\n            reversed_rename_cols = {v: k for (k, v) in rename_cols.items()}\n            result_df = result_df.rename(columns=reversed_rename_cols)\n        else:\n            result_df = pd.DataFrame()\n        return result_df\n\nclass EADModelPanel(BaseModelPanel):\n    dict_output_cols = {dan.input: [atn.facility_ssid_ui, atn.obligor_ssid_ui, atn.country_of_risk_ui, atn.crc_code_ui, atn.default_date_ui, atn.limit_ui, atn.outstanding_ui, atn.facility_type_ui], dan.rdd: [atn.facility_ssid_ui, atn.country_of_risk_mapped_ui, atn.default_flag_ui, atn.headroom_ui, atn.utilisation_ui, atn.product_group_ui], dan.intermediate: [atn.facility_ssid_ui, ead_constants.factor_ad, ead_constants.ad, ead_constants.factor_fd, ead_constants.fd, ead_constants.ad_cal_factor, ead_constants.fd_cal_factor, ead_constants.ad_moc_factor, ead_constants.ad_moc, ead_constants.fd_moc_factor, ead_constants.fd_moc], dan.output: [atn.facility_ssid_ui, ead_constants.ead_uncal, atn.ead_be_ui, ead_constants.ead_cal_dt, ead_constants.ead_moc]}\n\n    def calculate(self, **kwargs):\n        """Calculate the EAD model output"""\n        print('Calculating EAD model')\n        obligor_df = kwargs.get(dan.obligor)\n        facility_df = kwargs.get(dan.facility)\n        if any([len(facility_df) == 0, len(obligor_df) == 0]):\n            return pd.DataFrame()\n        rename_cols = atn.attribute_mapping\n        input_obligor_df = obligor_df.copy()\n        input_obligor_df = input_obligor_df.rename(columns=rename_cols)\n        input_facility_df = facility_df.copy()\n        input_facility_df = input_facility_df.rename(columns=rename_cols)\n        model = EAD_RDD(df_facility=input_facility_df, parameters=parameters_ead, df_obligor=input_obligor_df)\n        model.calculate()\n        result_df = model._dataset\n        reversed_rename_cols = {v: k for (k, v) in rename_cols.items()}\n        result_df = result_df.rename(columns=reversed_rename_cols)\n        return result_df\n\nclass LGDModelPanel(BaseModelPanel):\n    dict_output_cols = {dan.input: [atn.facility_ssid_ui, atn.obligor_ssid_ui, atn.country_of_risk_ui, atn.crc_code_ui, atn.default_date_ui, atn.limit_ui, atn.outstanding_ui, atn.lgd_manual_override_flag_ui, atn.lgd_manual_override_ui], dan.rdd: [atn.facility_ssid_ui, atn.country_of_risk_mapped_ui, atn.default_flag_ui, atn.years_on_books_facility_ui, atn.time_in_default_ui, atn.limit_obligor_ui, atn.outstanding_obligor_ui, atn.collateral_value_obligor_ui, atn.has_col_land_re_obligor_ui, atn.vtl_total_obligor_ui], dan.intermediate: [atn.facility_ssid_ui, lgd_constants.has_col_land_re_obligor_imputed, lgd_constants.vtl_total_obligor_imputed, lgd_constants.years_on_books_facility_imputed, lgd_constants.time_in_default_imputed, lgd_constants.has_col_land_re_obligor_transformed, lgd_constants.vtl_total_obligor_transformed, lgd_constants.years_on_books_facility_transformed, lgd_constants.time_in_default_transformed, lgd_constants.has_col_land_re_obligor_normalized, lgd_constants.vtl_total_obligor_normalized, lgd_constants.years_on_books_facility_normalized, lgd_constants.time_in_default_normalized], dan.output: [atn.facility_ssid_ui, lgd_constants.lgd_uncal, lgd_constants.lgd_cal, atn.lgd_be_ui, lgd_constants.lgd_dt, lgd_constants.lgd_moc]}\n\n    def calculate(self, **kwargs):\n        """Calculate the LGD model output"""\n        print('Calculating LGD model')\n        obligor_df = kwargs.get(dan.obligor)\n        facility_df = kwargs.get(dan.facility)\n        collerateral_df = kwargs.get(dan.collateral)\n        if len(collerateral_df) == 0:\n            collerateral_df = pd.DataFrame([['O1', 'C1', 'Equipment', 0, False]], columns=[n.name for n in collateral_columns.input_cols])\n            collerateral_df.head()\n        if any([len(facility_df) == 0, len(obligor_df) == 0, len(collerateral_df) == 0]):\n            return pd.DataFrame()\n        rename_cols = atn.attribute_mapping\n        input_obligor_df = obligor_df.copy()\n        input_obligor_df = input_obligor_df.rename(columns=rename_cols)\n        input_facility_df = facility_df.copy()\n        input_facility_df = input_facility_df.rename(columns=rename_cols)\n        input_collateral_df = collerateral_df.copy()\n        input_collateral_df = input_collateral_df.rename(columns=rename_cols)\n        model = LGD_RDD(df_facility=input_facility_df, parameters=parameters_lgd, df_collateral=input_collateral_df, df_obligor=input_obligor_df)\n        model.calculate()\n        result_df = model._dataset\n        reversed_rename_cols = {v: k for (k, v) in rename_cols.items()}\n        result_df = result_df.rename(columns=reversed_rename_cols)\n        return result_df\n\ndef format_table(df_input, index_col):\n    df = df_input.copy()\n    amount_cols = [atn.limit_ui, atn.outstanding_ui, atn.limit_obligor_ui, atn.outstanding_obligor_ui, atn.collateral_value_obligor_ui, atn.headroom_ui, atn.ead_be_ui]\n    for col in amount_cols:\n        if col in df.columns:\n            df[col] = df[col].apply(lambda x: f'{x:,.2f}')\n    percent_cols = [atn.pd_be_ui, atn.vtl_total_obligor_ui, atn.lgd_be_ui, atn.utilisation_ui]\n    for col in percent_cols:\n        if col in df.columns:\n            df[col] = df[col].apply(lambda x: f'{x:.2%}')\n    date_cols = [atn.reporting_date_ui]\n    for col in date_cols:\n        if col in df.columns:\n            df[col] = df[col].dt.strftime('%Y-%m-%d')\n    if index_col in df.columns:\n        df = df.set_index(index_col)\n    return df.T\n\nclass PDModelPanelUI(PDModelPanel):\n    """ " PD Model with modifications for country of risk dependent output columns"""\n    dict_output_cols = {dan.input: [atn.obligor_ssid_ui, atn.country_of_risk_ui, atn.reporting_date_ui, atn.pd_manual_override_flag_ui, atn.pd_manual_override_ui], dan.rdd: [atn.obligor_ssid_ui, atn.months_in_material_arrears_last_12m_ui, atn.cre_qual_management_merged_ui, atn.dscr_avg_3y_ui, atn.r3_2a_avg_3y_ui, atn.r5_2_avg_3y_ui, atn.r7_8_avg_3y_ui], dan.output: [atn.obligor_ssid_ui, atn.pd_be_ui, atn.rating_be_ui]}\n\n    @staticmethod\n    def get_columns(columns, df):\n        """Used for Panel bind function to display output\n\n        Returns None if df is None\n\n        RANZ (AU, NZ, AR): R3_2A = SUST_EBITDA / NetInterestPaid -> disable DSCR\n        USLA (US, CA, BR, CL, PE): DSCR = SUST_EBITDA / CPLTD -> disable R3_2A\n\n\n        """\n        if len(df) == 0:\n            return None\n        else:\n            if len(df[atn.country_of_risk_ui].unique()) > 1:\n                return format_table(df[columns], atn.obligor_ssid_ui)\n            country = df[atn.country_of_risk_ui].values[0]\n            if country in ['NZ', 'AU', 'AR']:\n                columns_new = [col for col in columns if atn.dscr_avg_3y_ui not in col]\n            elif country in ['US', 'BR', 'CL', 'CA', 'PE']:\n                columns_new = [col for col in columns if atn.r3_2a_avg_3y_ui not in col]\n            else:\n                columns_new = columns\n            return format_table(df[columns_new], atn.obligor_ssid_ui)\n\nclass EADModelPanelUI(EADModelPanel):\n    """ " EAD Model with modifications for country of risk dependent output columns"""\n    dict_output_cols = {dan.input: [atn.facility_ssid_ui, atn.obligor_ssid_ui, atn.country_of_risk_ui, atn.crc_code_ui, atn.default_date_ui, atn.limit_ui, atn.outstanding_ui, atn.limit_def_ui, atn.outstanding_def_ui, atn.facility_type_ui], dan.rdd: [atn.facility_ssid_ui, atn.country_of_risk_mapped_ui, atn.default_flag_ui, atn.headroom_ui, atn.utilisation_ui, atn.product_group_ui], dan.output: [atn.facility_ssid_ui, atn.ead_be_ui]}\n\n    @staticmethod\n    def get_columns(columns, df):\n        """Used for Panel bind function to display output\n\n        Returns None if df is None\n        """\n        if len(df) == 0:\n            return None\n        else:\n            return format_table(df[columns], atn.facility_ssid_ui)\n\nclass LGDModelPanelUI(LGDModelPanel):\n    """ " LGD Model with modifications for country of risk dependent output columns"""\n    dict_output_cols = {dan.input: [atn.facility_ssid_ui, atn.obligor_ssid_ui, atn.country_of_risk_ui, atn.crc_code_ui, atn.default_date_ui, atn.limit_ui, atn.outstanding_ui, atn.lgd_manual_override_flag_ui, atn.lgd_manual_override_ui], dan.rdd: [atn.facility_ssid_ui, atn.country_of_risk_mapped_ui, atn.default_flag_ui, atn.years_on_books_facility_ui, atn.time_in_default_ui, atn.limit_obligor_ui, atn.outstanding_obligor_ui, atn.collateral_value_obligor_ui, atn.has_col_land_re_obligor_ui, atn.vtl_total_obligor_ui], dan.output: [atn.facility_ssid_ui, atn.lgd_be_ui]}\n\n    @staticmethod\n    def get_columns(columns, df):\n        """Used for Panel bind function to display output\n\n        Returns None if df is None\n\n        - For BR, the HAS_COL_LAND_RE_OBLIGOR flag is not applicable\n        - For Performing, TIME_IN_DEFAULT is not applicable\n\n\n        """\n        if len(df) == 0:\n            return None\n        else:\n            if len(df[atn.country_of_risk_ui].unique()) > 1:\n                return format_table(df[columns], atn.facility_ssid_ui)\n            country = df[atn.country_of_risk_ui].values[0]\n            if country in ['BR']:\n                columns_new = [col for col in columns if atn.has_col_land_re_obligor_ui not in col]\n            else:\n                columns_new = columns\n            default = df[atn.default_flag_ui].any()\n            if not default:\n                columns_new = [col for col in columns_new if atn.time_in_default_ui not in col]\n            return format_table(df[columns_new], atn.facility_ssid_ui)\n\nclass OutputHandler:\n    """Class for processing and outputting the results of the model in a summary table\n    Can be used to output e.g. RWA results\n\n    The classmethods take kwargs with the model names as input. This method\n    will be used with pn.bind() to bind the model results with the output\n\n    Initialize each methods by obtaining the kwargs, i.e.\n\n    results_pd_df = kwargs.get(dan.pd)\n    results_ead_df = kwargs.get(dan.ead)\n    results_lgd_df = kwargs.get(dan.lgd)\n\n\n    """\n\n    @classmethod\n    def show_pd_results(cls, **kwargs) -> pd.DataFrame:\n        """Show obligor PD results\n\n        Args:\n            kwargs: Dataframes of model results\n        """\n        print('Showing PD Results')\n        results_pd_df = kwargs.get(dan.pd)\n        if len(results_pd_df) == 0:\n            return pd.DataFrame()\n        pd_df = results_pd_df[[atn.obligor_ssid_ui, atn.pd_be_ui, atn.rating_be_ui]]\n        return pd_df\n\n    @classmethod\n    def show_ead_and_lgd_results(cls, **kwargs) -> pd.DataFrame:\n        """Show obligor EAD and LGD results\n\n        Args:\n            kwargs: Dataframes of model results\n        """\n        print('Showing EAD/LGD Results')\n        results_ead_df = kwargs.get(dan.ead)\n        results_lgd_df = kwargs.get(dan.lgd)\n        if any([len(results_ead_df) == 0, len(results_lgd_df) == 0]):\n            return pd.DataFrame()\n        if results_ead_df[atn.facility_ssid_ui].duplicated().any():\n            return pn.pane.Markdown('\\n             **Warning**: Facility IDs must be unique. Please ensure that each facility ID in the input is distinct for a successful calculation.\\n            ')\n        ead_df = results_ead_df[[atn.facility_ssid_ui, atn.obligor_ssid_ui, atn.ead_be_ui]]\n        lgd_df = results_lgd_df[[atn.facility_ssid_ui, atn.obligor_ssid_ui, atn.lgd_be_ui]]\n        output_df = ead_df.merge(lgd_df, on=[atn.facility_ssid_ui, atn.obligor_ssid_ui], how='left')\n        output_df[atn.ead_be_ui] = output_df[atn.ead_be_ui].map('{:,.2f}'.format)\n        output_df[atn.lgd_be_ui] = output_df[atn.lgd_be_ui].map('{:.2%}'.format)\n        return output_df\n\n    @classmethod\n    def show_obligor_results(cls, **kwargs) -> pd.DataFrame:\n        """Show obligor results\n            - PD and Rating BE\n            - Sum of EAD BE\n            - EAD BE weighted average of LGD_BE\n\n\n        Args:\n            kwargs: Dataframes of model results\n        """\n        print('Showing obligor PD/EAD/LGD Results')\n        results_pd_df = kwargs.get(dan.pd)\n        results_ead_df = kwargs.get(dan.ead)\n        results_lgd_df = kwargs.get(dan.lgd)\n        if len(results_pd_df) == 0:\n            return pd.DataFrame()\n        pd_df = results_pd_df[[atn.obligor_ssid_ui, atn.pd_be_ui, atn.rating_be_ui]]\n        if not any([len(results_ead_df) == 0, len(results_lgd_df) == 0]):\n            if results_ead_df[atn.facility_ssid_ui].duplicated().any():\n                return pn.pane.Markdown('\\n                 **Warning**: Facility IDs must be unique. Please ensure that each facility ID in the input is distinct for a successful calculation.\\n                ')\n            ead_df = results_ead_df[[atn.facility_ssid_ui, atn.obligor_ssid_ui, atn.ead_be_ui]]\n            lgd_df = results_lgd_df[[atn.facility_ssid_ui, atn.obligor_ssid_ui, atn.lgd_be_ui]]\n            merged_df = ead_df.merge(lgd_df, on=[atn.facility_ssid_ui, atn.obligor_ssid_ui], how='left')\n            grouped_df = merged_df.groupby(atn.obligor_ssid_ui)\n            weighted_avg_func = lambda x: np.average(x, weights=merged_df.loc[x.index, atn.ead_be_ui])\n            wa_lgd = grouped_df.agg(ead_be_sum=(atn.ead_be_ui, 'sum'), weighted_avg=(atn.lgd_be_ui, weighted_avg_func))\n            pd_df = pd_df.merge(wa_lgd, how='left', on=atn.obligor_ssid_ui)\n            amount_cols = ['ead_be_sum']\n            for col in amount_cols:\n                pd_df[col] = pd_df[col].map('{:,.2f}'.format)\n            percent_cols = [atn.pd_be_ui, 'weighted_avg']\n            for col in percent_cols:\n                pd_df[col] = pd_df[col].map('{:.2%}'.format)\n        pd_df = pd_df.rename(columns={'ead_be_sum': 'Sum of EAD Best Estimate', 'weighted_avg': 'Average of LGD Best Estimate'})\n        description = pn.pane.Markdown('\\n            - **PD Best Estimate**: The PD Best Estimate of the obligor\\n            - **Rating Best Estimate**: The Rating Best Estimate of the obligor\\n            - **Sum of EAD Best Estimate**: Sum of the EAD BEst Estimate of all facilities\\n            - **Average LGD Best Estimate**: Average of LGD Best Estimate weighted by the EAD Best Estimate\\n            ')\n        return pn.Row(pd_df, description)\n\nmodels = {dan.pd: {dan.model: PDModelPanelUI(), dan.rating_cols_to_display: (obligor_columns.rating_to_display, obligor_columns.id_to_display)}, dan.ead: {dan.model: EADModelPanelUI()}, dan.lgd: {dan.model: LGDModelPanelUI()}}\ninitial_inputs = {dan.input_cols: input_columns.input_cols, dan.input_cols_description: input_columns.input_cols_description}\ninputs = {dan.obligor: {dan.input_cols: obligor_columns.input_cols, dan.input_cols_description: obligor_columns.input_cols_description}, dan.facility: {dan.input_cols: facility_columns.input_cols, dan.input_cols_description: facility_columns.input_cols_description}, dan.collateral: {dan.input_cols: collateral_columns.input_cols, dan.input_cols_description: collateral_columns.input_cols_description}}\noutputs = {dan.summary: {dan.obligor_results: OutputHandler.show_obligor_results, dan.facility_results: OutputHandler.show_ead_and_lgd_results, dan.pd_ratings: {dan.rating_cols_to_display: (obligor_columns.rating_to_display, obligor_columns.id_to_display)}}}\nmodel_name = 'Rural Model 2.0'\nmodel_version = '1.3.7'\nboard = Dashboard(title=model_name, models=models, initial_inputs=initial_inputs, inputs=inputs, outputs=outputs, version=model_version+', Build ID 22536836', description=descr.info_text)\nboard.app().servable()\n'\\nTODO:\\nx- Extra input layer: add help function to copy widget\\nx- Hide tiptool\\nx- make sure Country of risk is added\\nx - Link performing/default to table\\nx- Rename input attributes: think of structure\\nx- Link override to table\\nx- Hide Brazil LGD Land or RE flag\\nx- Add tooltips to input attributes\\nx- Rename RDD and output attributes and add description: PD\\nx- Rename and description: EAD/LGD\\nx- Update Summary tab; including warning for duplicate facilities\\nx- Put input layer in config with description\\nx- Update Info tab with description\\n\\n\\nRedundant:\\n- Hide table columns: maybe leave it as auto-filled columns\\n\\nLater:\\n- Update pipeline\\n- Make sure original html still works, i.e. add RDD back. Maybe inherent class and overwrite\\n\\n\\n'\n\n\nawait write_doc()`
      await pyodide.runPythonAsync(code);
    }

ses":["loader","light"],"stylesheets":[":host { --loading-spinner-size: 20px; }","\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"type":"object","name":"ImportedStyleSheet","id":"p2102","attributes":{"url":"https://cdn.holoviz.org/panel/1.4.0/dist/css/loading.css"}},{"type":"object","name":"ImportedStyleSheet","id":"p2103","attributes":{"url":"https://cdn.holoviz.org/panel/1.4.0/dist/css/loadingspinner.css"}},{"id":"p2097"}],"min_width":20,"min_height":20,"margin":[5,10],"align":"start"}},{"type":"object","name":"panel.models.tabs.Tabs","id":"p1023","attributes":{"name":"main-140570162948000","tags":["main"],"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"type":"object","name":"ImportedStyleSheet","id":"p2104","attributes":{"url":"https://cdn.holoviz.org/panel/1.4.0/dist/css/loading.css"}},{"id":"p2097"}],"margin":0,"align":"start","tabs":[{"type":"object","name":"TabPanel","id":"p1029","attributes":{"name":"Column00200","title":"Info","child":{"type":"object","name":"panel.models.layout.Column","id":"p1024","attributes":{"name":"Column00200","stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"type":"object","name":"ImportedStyleSheet","id":"p2105","attributes":{"url":"https://cdn.holoviz.org/panel/1.4.0/dist/css/loading.css"}},{"type":"object","name":"ImportedStyleSheet","id":"p2106","attributes":{"url":"https://cdn.holoviz.org/panel/1.4.0/dist/css/listpanel.css"}},{"id":"p2097"}],"margin":0,"align":"start","children":[{"type":"object","name":"panel.models.markup.HTML","id":"p1026","attributes":{"styles":{"type":"map","entries":[["font-size","10pt"]]},"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"type":"object","name":"ImportedStyleSheet","id":"p2107","attributes":{"url":"https://cdn.holoviz.org/panel/1.4.0/dist/css/loading.css"}},{"id":"p2097"}],"width":700,"min_width":700,"margin":[5,10],"align":"start","text":"\n&amp;lt;!DOCTYPE html&amp;gt;\n&amp;lt;html lang=&amp;quot;en&amp;quot;&amp;gt;\n&amp;lt;head&amp;gt;\n       &amp;lt;meta charset=&amp;quot;UTF-8&amp;quot;&amp;gt;\n       &amp;lt;meta name=&amp;quot;viewport&amp;quot; content=&amp;quot;width=device-width, initial-scale=1.0&amp;quot;&amp;gt;\n       &amp;lt;title&amp;gt;Tool Description and Instructions&amp;lt;/title&amp;gt;\n&amp;lt;/head&amp;gt;\n&amp;lt;body&amp;gt;\n       &amp;lt;h2&amp;gt;Introduction&amp;lt;/h2&amp;gt;\n       &amp;lt;p&amp;gt;The Rural Prototype tool&amp;lt;sup&amp;gt;1&amp;lt;/sup&amp;gt;: &amp;lt;/p&amp;gt;\n           &amp;lt;ul&amp;gt;\n        &amp;lt;li&amp;gt;Is a self-contained HTML tool that runs directly from the browser. &amp;lt;/li&amp;gt;\n        &amp;lt;li&amp;gt;Its aim is to provide directional guidance on the impact of the new model. &amp;lt;/li&amp;gt;\n        &amp;lt;li&amp;gt;Is available for a selective group of users to analyze the impact of the new Rural Model v2.0 at a Joint Obligor/Facility level.&amp;lt;/li&amp;gt;\n    &amp;lt;/ul&amp;gt;\n   &amp;lt;p&amp;gt;Key features of the Rural Prototype: &amp;lt;/p&amp;gt;\n           &amp;lt;ul&amp;gt;\n        &amp;lt;li&amp;gt;Is developed and fully aligned with PD/LGD/EAD models of the new Rural Model v2.0.&amp;lt;/li&amp;gt;\n        &amp;lt;li&amp;gt;The PD, LGD and EAD outputs are on Best Estimates level, i.e. they do not include conservatism required by regulation for capital calculation (Margin of Conservatism and Additional Conservatism) and downturn adjustment (only for EAD and LGD).&amp;lt;/li&amp;gt;\n        &amp;lt;li&amp;gt;Can calculate the results for multiple obligors and facilities simultaneously to support impact comparisons.&amp;lt;/li&amp;gt;\n    &amp;lt;/ul&amp;gt;\n   &amp;lt;p&amp;gt;Instructions: &amp;lt;/p&amp;gt;\n       &amp;lt;ul&amp;gt;\n          &amp;lt;li&amp;gt;In the input sheet, first add obligors, facilities, and collaterals. The added rows will be shown in the tables below and can be modified.&amp;lt;/li&amp;gt;\n          &amp;lt;li&amp;gt;Next, press calculate. The results will be displayed in the PD, EAD, LGD and Summary sheets.&amp;lt;/li&amp;gt;\n       &amp;lt;/ul&amp;gt;\n     &amp;lt;p&amp;gt;Note: &amp;lt;/p&amp;gt;\n        &amp;lt;ul&amp;gt;\n           &amp;lt;li&amp;gt;A PD&amp;lt;sup&amp;gt;2&amp;lt;/sup&amp;gt; calculation can be calculated by itself. To do this, all the obligor information needs to be filled. LGD requires Obligor, Facility and Collateral information to be supplied, while EAD requires Obligor and Facility information.&amp;lt;/li&amp;gt;\n           &amp;lt;li&amp;gt;Ensure that the IDs are unique when performing calculations with multiple obligors, facilities, and collateral.&amp;lt;/li&amp;gt;\n           &amp;lt;li&amp;gt;The prototype does not support currency conversions. Therefore, if an obligor has multiple facilities in different currencies, the values should be first converted to a single common currency.&amp;lt;/li&amp;gt;\n           &amp;lt;li&amp;gt;For derivate facilities the EAD model is not used to predict an EAD. Instead users should provide the EAD. This should be entered in the Outstanding field of the facility inputs&amp;lt;/li&amp;gt;\n        &amp;lt;/ul&amp;gt;\n\n      &amp;lt;p style=&amp;quot;font-size: 12px;&amp;quot;&amp;gt;&amp;lt;sup&amp;gt;1&amp;lt;/sup&amp;gt;Proprietary tool developed by Tribe Credit Analytics (TCA), Area Rural.&amp;lt;/p&amp;gt;\n      &amp;lt;p style=&amp;quot;font-size: 12px;&amp;quot;&amp;gt;&amp;lt;sup&amp;gt;2&amp;lt;/sup&amp;gt;Rural 2.0 PD model will have the same shadow qualitative questions as Rural 1.0 PD Model. These qualitative questions are not included in the prototype as they do not have an impact on the PD output.&amp;lt;/p&amp;gt;\n\n    &amp;lt;br&amp;gt;\n\n    &amp;lt;h2&amp;gt;General rules of engagement&amp;lt;/h2&amp;gt;\n    &amp;lt;ul&amp;gt;\n        &amp;lt;li&amp;gt;The Prototype is &amp;lt;b&amp;gt;not identical to the CAS calculator in production&amp;lt;/b&amp;gt;. It\u2019s developed as close to reality as possible. However, as it does not include validation checks, error handling and does not cover all possible edge cases, it can&amp;#x27;t be ensured that it will provide the same exact results as those expected in the production environment once the model will go-live.&amp;lt;/li&amp;gt;\n        &amp;lt;li&amp;gt;Therefore, its &amp;lt;b&amp;gt;use should be strictly limited&amp;lt;/b&amp;gt; to the sole purpose of familiarizing with the model and only until the model is officially deployed (expected March 2026).&amp;lt;/li&amp;gt;\n        &amp;lt;li&amp;gt;The prototype must not be used after the model is live in production (expected March 2026). Once the model is live, the only source of truth will be the model outcomes provided via the front-end systems (CROP, BAW).&amp;lt;/li&amp;gt;\n        &amp;lt;li&amp;gt;Prototype &amp;lt;b&amp;gt;should not be the basis for decision making related to any of the model uses&amp;lt;/b&amp;gt; such as loan application and acceptance, pricing, provisioning, capital planning, etc.&amp;lt;/li&amp;gt;\n        &amp;lt;li&amp;gt;Prototype should be treated as &amp;lt;b&amp;gt;confidential&amp;lt;/b&amp;gt;.&amp;lt;/li&amp;gt;\n        &amp;lt;li&amp;gt;Prototype is a &amp;lt;b&amp;gt;live working tool&amp;lt;/b&amp;gt;. It will be updated whenever the need arises. Users will be notified when significant changes are done that would impact the outcomes.&amp;lt;/li&amp;gt;\n    &amp;lt;/ul&amp;gt;\n\n&amp;lt;/body&amp;gt;\n&amp;lt;/html&amp;gt;\n","disable_math":true}}]}}}},{"type":"object","name":"TabPanel","id":"p1905","attributes":{"name":"Column00390","title":"Input","child":{"type":"object","name":"panel.models.layout.Column","id":"p1030","attributes":{"name":"Column00390","stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"type":"object","name":"ImportedStyleSheet","id":"p2108","attributes":{"url":"https://cdn.holoviz.org/panel/1.4.0/dist/css/loading.css"}},{"type":"object","name":"ImportedStyleSheet","id":"p2109","attributes":{"url":"https://cdn.holoviz.org/panel/1.4.0/dist/css/listpanel.css"}},{"id":"p2097"}],"margin":0,"align":"start","children":[{"type":"object","name":"Row","id":"p1031","attributes":{"name":"Row00384","stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"type":"object","name":"ImportedStyleSheet","id":"p2110","attributes":{"url":"https://cdn.holoviz.org/panel/1.4.0/dist/css/loading.css"}},{"type":"object","name":"ImportedStyleSheet","id":"p2111","attributes":{"url":"https://cdn.holoviz.org/panel/1.4.0/dist/css/listpanel.css"}},{"id":"p2097"}],"margin":0,"align":"start","children":[{"type":"object","name":"panel.models.widgets.Button","id":"p1035","attributes":{"button_type":"primary","subscribed_events":{"type":"set","entries":["button_click"]},"css_classes":["solid"],"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"type":"object","name":"ImportedStyleSheet","id":"p2112","attributes":{"url":"https://cdn.holoviz.org/panel/1.4.0/dist/css/loading.css"}},{"type":"object","name":"ImportedStyleSheet","id":"p2113","attributes":{"url":"https://cdn.holoviz.org/panel/1.4.0/
